<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && window.location.hostname !== '[::1]') {
    window.location.replace('https:' + window.location.href.substring(window.location.protocol.length));
  }
</script>
{% if page.title == site.title %}
<title>{{ site.title | escape }}</title>
{% else %}
<title>{{ page.title | default: site.title | escape }} — {{ site.title | escape }}</title>
{% endif %}
{% assign page_description = page.description | default: site.description %}
<meta name="description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% if page.portfolio_deck %}
<link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/logo.svg' | absolute_url }}">
<meta name="twitter:card" content="summary">
