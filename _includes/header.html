<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Mandiri Agung Yatra, home">
      <span class="brand-mark" aria-hidden="true">M<span>.</span></span>
      <span class="brand-name">Mandiri Agung<br>Yatra</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span>
    </button>
    <nav class="nav" id="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/portfolio/' | relative_url }}"{% if page.url contains '/portfolio' %} aria-current="page"{% endif %}>Portfolio</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
      <a class="nav-contact" href="mailto:{{ site.email }}">Let's talk <span aria-hidden="true">↗</span></a>
    </nav>
  </div>
</header>
